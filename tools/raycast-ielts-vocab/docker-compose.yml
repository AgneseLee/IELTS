services:
  ielts-vocab-mcp:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      WORDS_FILE: /workspace/words-collected.md
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MCP_PORT:-11436}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ../..:/workspace
