services:
  ielts-vocab-mcp:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DEEPSEEK_URL: http://raycast-ai-proxy:3000/api/chat
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      VIEWS_FILE: /data/task2/views-v2.md
      PREVIEW_TTL_MS: ${PREVIEW_TTL_MS:-1800000}
    ports:
      - "127.0.0.1:${MCP_PORT:-11436}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ../../writing/task2:/data/task2
    networks:
      - raycast-proxy

networks:
  raycast-proxy:
    external: true
    name: ${RAYCAST_PROXY_NETWORK:-raycast-ai-openrouter-proxy_default}
