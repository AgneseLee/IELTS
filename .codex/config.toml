approval_policy = "on-request"

[permissions.ielts-workspace]
description = "Edit the IELTS workspace and manage its Git repository."
extends = ":workspace"

[permissions.ielts-workspace.filesystem.":workspace_roots"]
".git" = "write"

[permissions.ielts-workspace.network]
enabled = true

[permissions.ielts-workspace.network.domains]
"github.com" = "allow"
